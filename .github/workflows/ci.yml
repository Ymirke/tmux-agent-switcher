name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --all
      - name: Format
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all
        continue-on-error: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck launcher scripts
        run: shellcheck bin/tmux-agent-sidebar bin/tmux-agent-sidebar-fetch bin/tmux-agent-sidebar-popup tmux-agent-sidebar.tmux
        continue-on-error: true
