[package]
name = "tmux-agent-sidebar"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A tmux sidebar that switches windows and monitors running AI coding agents (Claude Code, Codex, OpenCode) by passive observation."
authors = ["Ymir Egilson <36711026+Ymirke@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/Ymirke/tmux-agent-sidebar"
homepage = "https://github.com/Ymirke/tmux-agent-sidebar"
readme = "README.md"
keywords = ["tmux", "tui", "claude", "codex", "opencode"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/examples", "/*.tmux"]

[dependencies]
anyhow = "1"
crossterm = "0.27"
ratatui = "0.26"

[dev-dependencies]
tempfile = "3"
